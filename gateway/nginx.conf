server {
  listen 80;
  server_name _;
  location /api/products/ { proxy_pass http://products:8001/; }
  location /api/search/ { proxy_pass http://search:8002/; }
  location /api/cart/ { proxy_pass http://cart:8003/; }
  location /api/orders/ { proxy_pass http://orders:8004/; }
  location /api/recommendations/ { proxy_pass http://recommendations:8005/; }
  location /api/chat/ { proxy_pass http://chat:8006/; }
  location / { proxy_pass http://frontend:80; }
}
