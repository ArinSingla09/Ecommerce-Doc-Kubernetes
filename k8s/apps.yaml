# ==========================================
# 1. PRODUCTS MICROSERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
        - name: products
          image: shopspherearin2026.azurecr.io/shopsphere-products:v1
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: products
  namespace: shopsphere
spec:
  selector:
    app: products
  ports:
    - port: 8001
      targetPort: 8000
  type: ClusterIP

---
# ==========================================
# 2. SEARCH MICROSERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: shopspherearin2026.azurecr.io/shopsphere-search:v1
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: PRODUCTS_URL
              value: "http://products:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: shopsphere
spec:
  selector:
    app: search
  ports:
    - port: 8002
      targetPort: 8000
  type: ClusterIP

---
